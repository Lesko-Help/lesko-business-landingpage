# Read by ~/.werk/wt-new.sh when it cuts a worktree. Ignored files never travel
# with a worktree, so these are brought in. This repo has none: no
# credentials, no data, no venv — the page is a static file and Cloudflare
# builds it from GitHub.
WT_CARRY=""

# The page is one file; most tasks are a small edit with a look at the live
# page afterwards. No product or architecture gate, only the review of the
# finished diff once it passes 300 lines. The review word is spelled out
# because a bare "klein" gives no review either: wt_stages_list appends its
# default review:300 only when the preset leaves a word behind, and klein
# leaves none, so bare klein is oneshot. Proved 2026-10-12: `klein` -> [],
# `klein review:300` -> [review:300].
# A bigger task (a new section, a second page) overrides per task and gets
# the product + architecture gates:
#   WT_STAGES=midden wt-new.sh <name> "<goal>".
WT_STAGES="klein review:300"

# Extra tmux windows, index 7 and up ("N:name:cmd", see werk.zsh); empty = none.
WERK_WINDOWS=""
